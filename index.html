<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pagamento via QR Code</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #f4f6f8;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .card {
      background: #ffffff;
      width: 100%;
      max-width: 400px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
      padding: 24px;
      text-align: center;
    }

    .header {
      margin-bottom: 20px;
    }

    .header h2 {
      font-size: 1.25rem;
      color: #1a1a1a;
      margin-bottom: 8px;
    }

    .balance-box {
      background-color: #f0f7ff;
      border: 1px solid #d0e3ff;
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 24px;
    }

    .balance-label {
      font-size: 0.85rem;
      color: #555;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .balance-value {
      font-size: 1.5rem;
      font-weight: 700;
      color: #0066cc;
      margin-top: 4px;
    }

    .qr-container {
      background: #ffffff;
      padding: 16px;
      border-radius: 12px;
      border: 1px solid #e1e4e8;
      display: inline-block;
      margin-bottom: 20px;
    }

    .qr-container img {
      width: 180px;
      height: 180px;
      display: block;
    }

    .instructions {
      font-size: 0.9rem;
      color: #666;
      margin-bottom: 24px;
      line-height: 1.4;
    }

    .btn {
      display: block;
      width: 100%;
      padding: 14px;
      background-color: #0066cc;
      color: #ffffff;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 1rem;
      transition: background 0.2s;
    }

    .btn:hover {
      background-color: #0052a3;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="header">
      <h2>Pagar com QR Code</h2>
    </div>

    <div class="balance-box">
      <div class="balance-label">Saldo Disponível</div>
      <div class="balance-value">R$ 10.000.000,00</div>
    </div>

    <div class="qr-container">
      <!-- Exemplo de imagem de QR Code simulada -->
      <img src="https://api.qrserver.com/v1/create-qr-code/?size=180x180&data=ExemploPagamento10Milhoes" alt="QR Code de Pagamento">
    </div>

    <p class="instructions">
      Escaneie o QR Code acima utilizando o aplicativo do seu banco para concluir o pagamento.
    </p>

    <button class="btn" onclick="alert('Função de confirmação simulada!')">Confirmar Pagamento</button>
  </div>

</body>
</html>
